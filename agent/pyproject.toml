[project]
name = "loan-desk-agent"
version = "0.1.0"
description = "The loan desk's Deep Agent on Managed Deep Agents, with Sam Partee's langchain_arcade vendored in langchain_arcade/."
requires-python = ">=3.11,<3.13"
dependencies = [
    "managed-deepagents==0.8.0",
    "deepagents>=0.7.0,<0.8.0",
    "arcadepy>=1.0.0",
    "pyyaml>=6.0",
    "langchain-openai>=1.0",
]

[project.optional-dependencies]
# Only for a real model. The scripted one needs none of these. langchain-openai is in
# the dependencies above instead, because `mda dev` and `mda deploy` build their venv from
# the dependency list alone, and an extra never reaches the agent they run.
anthropic = ["langchain-anthropic>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]
# Module 04: the notebook, the LangSmith client and the audit reader. `uv sync --group evals`.
evals = [
    "langsmith>=0.4",
    "requests>=2.32",
    "jupyterlab>=4.2",
]

[tool.uv]
package = false

[tool.mda]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
